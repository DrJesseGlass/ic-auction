name: Release

# Push a tag v<version> (matching Cargo.toml) to publish to crates.io.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
      - name: CHANGELOG has an entry for this version
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "no CHANGELOG entry for ${version}" >&2; exit 1; }
      - run: rustup toolchain install
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
